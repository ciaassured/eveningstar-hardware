name: KiCad DRC

on:
  pull_request:
    branches:
      - main
    paths:
      - "pcb/**"
      - "flake.nix"
      - "flake.lock"
      - "pcb/nix/**"
      - ".github/workflows/kicad-drc.yml"

jobs:
  electrical-and-design-rules:
    name: ERC and DRC
    runs-on: ubuntu-24.04
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Cachix
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ env.CACHIX_AUTH_TOKEN == '' }}

      - name: Check vendored subtree drift
        run: nix run .#subtree-drift

      - name: Check KiCad dev shell
        run: nix develop --command kicad-cli version

      - name: Check KiCad repo-local references
        run: nix run .#kicad-locality

      - name: Run ERC and DRC
        if: always()
        run: nix run .#drc

      - name: Generate PCB review artifacts
        if: always()
        run: nix run .#pcb-review

      - name: Upload KiCad reports
        if: ${{ always() && hashFiles('reports/*.rpt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kicad-rule-check-reports
          path: reports/*.rpt
          if-no-files-found: error

      - name: Upload PCB review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcb-review-artifacts
          path: reports/review/**
          if-no-files-found: error
