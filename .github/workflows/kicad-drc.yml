name: KiCad DRC

on:
  pull_request:
    branches:
      - main
    paths:
      - "pcb/**"
      - ".github/workflows/kicad-drc.yml"

jobs:
  electrical-and-design-rules:
    name: ERC and DRC
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install KiCad
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
          kicad-cli --version

      - name: Run ERC and DRC
        run: |
          set +e
          mkdir -p reports

          echo "::group::KiCad ERC"
          kicad-cli sch erc \
            --severity-error \
            --severity-warning \
            --exit-code-violations \
            --format report \
            --output reports/erc.rpt \
            pcb/EveningStar.kicad_sch
          erc_status=$?
          cat reports/erc.rpt
          echo "::endgroup::"

          echo "::group::KiCad DRC"
          kicad-cli pcb drc \
            --severity-error \
            --severity-warning \
            --schematic-parity \
            --exit-code-violations \
            --format report \
            --output reports/drc.rpt \
            pcb/EveningStar.kicad_pcb
          drc_status=$?
          cat reports/drc.rpt
          echo "::endgroup::"

          if [ "${erc_status}" -ne 0 ] || [ "${drc_status}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload KiCad reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-rule-check-reports
          path: reports/*.rpt
          if-no-files-found: error
